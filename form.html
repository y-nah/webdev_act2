<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benefits</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body
    class="bg-gray-100 font-sans bg-[url('https://i.pinimg.com/1200x/b5/9d/b0/b59db0a5b2331a2dfb33ae5148481ccc.jpg')] bg-no-repeat bg-cover bg-bottom bg-fixed"
  >
    <div
      class="flex justify-center gap-5 m-4 p-4 bg-pink-200 shadow-md rounded-lg"
    >
      <a href="blog.html" class="font-serif hover:text-pink-600"
        >Introduction</a
      >
      |
      <a href="facts.html" class="font-serif hover:text-pink-600">Fun Facts</a>
      |
      <a href="form.html" class="font-serif hover:text-pink-600">Form</a>
    </div>

    <div class="max-w-2xl mx-auto bg-pink-200 p-6 rounded-2xl shadow-xl/30">
      <h2 class="text-2xl font-bold mb-2">📝 Cat Adoption Interest Form</h2>
      <h2 class="animate-spin">🐱</h2>
      <p class="text-gray-600 mb-6">Please input your information</p>

      <form action="thanks.html" method="GET" class="space-y-4">
        <div>
          <label class="block text-gray-700">Name:</label>
          <input
            type="text"
            name="name"
            required
            class="w-full border border-red-300 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-gray-700">Email Address:</label>
          <input
            type="email"
            name="email"
            required
            class="w-full border border-red-300 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-gray-700">Phone Number:</label>
          <input
            type="tel"
            name="phone"
            required
            class="w-full border border-red-300 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <h3 class="font-semibold">Do you currently have pets?</h3>
          <label class="mr-4">
            <input
              type="radio"
              name="pets"
              value="yes"
              required
              class="mr-2 accent-pink-400"
            />
            Yes
          </label>
          <label>
            <input
              type="radio"
              name="pets"
              value="no"
              class="mr-2 accent-pink-400"
            />
            No
          </label>
        </div>

        <div>
          <h3 class="font-semibold">What type of cat are you interested in?</h3>
          <div class="space-y-2">
            <label class="block">
              <input
                type="radio"
                name="type"
                value="kitten"
                required
                class="mr-2 accent-pink-400"
              />
              Kitten
            </label>
            <label class="block">
              <input
                type="radio"
                name="type"
                value="adult"
                class="mr-2 accent-pink-400"
              />
              Adult
            </label>
            <label class="block">
              <input
                type="radio"
                name="type"
                value="senior"
                class="mr-2 accent-pink-400"
              />
              Senior
            </label>
            <label class="block">
              <input
                type="radio"
                name="type"
                value="any"
                class="mr-2 accent-pink-400"
              />
              Any
            </label>
          </div>
        </div>

        <div>
          <h3 class="font-semibold">Preferred cat personality</h3>
          <div class="space-y-2">
            <label class="block">
              <input
                type="radio"
                name="personality"
                value="Playful"
                required
                class="mr-2 accent-pink-400"
              />
              Playful & Energetic
            </label>
            <label class="block">
              <input
                type="radio"
                name="personality"
                value="Calm"
                class="mr-2 accent-pink-400"
              />
              Calm & Cuddly
            </label>
            <label class="block">
              <input
                type="radio"
                name="personality"
                value="Independent"
                class="mr-2 accent-pink-400"
              />
              Independent
            </label>
            <label class="block">
              <input
                type="radio"
                name="personality"
                value="Any"
                class="mr-2 accent-pink-400"
              />
              Doesn’t Matter
            </label>
          </div>
        </div>

        <div>
          <label class="block text-gray-700"
            >Why do you want to adopt a cat?</label
          >
          <textarea
            name="reason"
            rows="4"
            required
            class="w-full border border-red-300 rounded-lg px-3 py-2 mt-1 focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
        </div>

        <button
          type="submit"
          class="inline-block w-full bg-red-300 text-white py-2 rounded-lg hover:bg-pink-400 transition hover:animate-bounce shadow-xl shadow-pink-500/50"
        >
          Submit Form
        </button>
      </form>
    </div>
  </body>
</html>
